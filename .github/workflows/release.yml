name: Release Build

on:
  workflow_dispatch:

  release:
    types: [ published ]

env:
  previous_commit: ${{ github.event.before }}
  commit_msg: ${{ github.event.head_commit.message }}
  commit_id: ${{ github.sha }}
  version_status: release

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      # Publish task runs build
      - name: Publish to Modrinth
        run: gradle modrinth --stacktrace
        continue-on-error: true
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}

      - name: Notify Successful Build
        if: success() && !skipped()
        run: gradle release-build --stacktrace
        env:
          BUILD_WEBHOOK: ${{ secrets.BUILD_WEBHOOK }}

      - name: Notify Failed Build
        if: failure() && !skipped()
        run: gradle failed-build --stacktrace
        env:
          BUILD_WEBHOOK: ${{ secrets.BUILD_WEBHOOK }}