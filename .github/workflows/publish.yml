name: Publish

on:
  workflow_dispatch:

  workflow_run:
    workflows: ["Release", "Snapshot"]
    types:
      - completed

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Publish task runs build
      - name: Publish to Modrinth
        run: gradle modrinth --stacktrace
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}