name: Build Project

on:
  workflow_dispatch:
  workflow_call:

  workflow_run:
    workflows: ["Release Build", "Snapshot Build"]
    types:
      - completed

env:
  commit_msg: ${{ github.event.head_commit.message }}
  commit_id: ${{ github.sha }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: corretto
          java-version: 25

      - name: Print Git Information
        run: | 
          echo "$commit_msg"
          echo "$commit_id"

      #- name: Setup Gradle
