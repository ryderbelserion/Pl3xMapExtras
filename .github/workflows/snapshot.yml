name: Snapshot Build

on:
  workflow_dispatch:

  push:
    paths-ignore:
      - 'gradle/wrapper/**'
      - '.github/**'
      - '.idea/icon.png'

      - 'changelog.md'
      - 'README.md'
      - 'notes.md'
      - 'LICENSE'

      - '.gitignore'

      - 'gradlew.bat'
      - 'gradlew'

    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Make sure it builds first.
      - name: Build
        run: ./.github/workflows/build.yml