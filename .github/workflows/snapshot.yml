name: Snapshot Build

on:
  workflow_dispatch:

  push:
    paths-ignore:
      - 'gradle/wrapper/**'
      - '.github/**'
      - '.idea/icon.png'

      - 'changelog.md'
      - 'README.md'
      - 'notes.md'
      - 'LICENSE'

      - '.gitignore'

      - 'gradlew.bat'
      - 'gradlew'

    branches:
      - main

env:
  previous_commit: ${{ github.event.before }}
  commit_msg: ${{ github.event.head_commit.message }}
  commit_id: ${{ github.sha }}
  version_status: beta

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      # Publish task runs build
      - name: Publish to Modrinth
        run: gradle modrinth --stacktrace
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}

      - name: Notify Successful Build
        if: success()
        run: gradle release-build --stacktrace
        env:
          BUILD_WEBHOOK: ${{ secrets.BUILD_WEBHOOK }}

      - name: Notify Failed Build
        if: failure()
        run: gradle failed-build --stacktrace
        env:
          BUILD_WEBHOOK: ${{ secrets.BUILD_WEBHOOK }}