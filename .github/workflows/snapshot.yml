name: Snapshot Build

on:
  workflow_dispatch:

  push:
    paths-ignore:
      - 'gradle/wrapper/**'
      - '.github/**'
      - '.idea/icon.png'

      - 'changelog.md'
      - 'README.md'
      - 'notes.md'
      - 'LICENSE'

      - '.gitignore'

      - 'gradlew.bat'
      - 'gradlew'

    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: corretto
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build
        run: gradle build --stacktrace

      - name: Publish to Modrinth
        run: gradle modrinth --stacktrace
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}

      - name: Notify Discord
        if: success()
        run: gradle release-build --stacktrace
        env:
          BUILD_WEBHOOK: ${{ secrets.BUILD_WEBHOOK }}