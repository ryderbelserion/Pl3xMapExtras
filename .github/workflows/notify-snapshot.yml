name: Notify Snapshot

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.repository_owner == 'ryderbelserion'

    uses: ryderbelerion/ryderbelserion/.github/workflows/notify.yml@main

    with:
      status: "beta"
      branch: main

    secrets:
      webhook: ${{ secrets.BUILD_WEBHOOK }}