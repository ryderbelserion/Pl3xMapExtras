name: Publish

on:
  workflow_dispatch:

  workflow_run:
    workflows: ["Release", "Snapshot"]
    types:
      - completed

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Build
        run: ./.github/workflows/build.yml